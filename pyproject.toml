[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
filterwarnings = [
    "ignore:datetime.datetime.utcfromtimestamp:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Данные каталога ниш: длинные русские строки-описания не делим.
"data/niches.py" = ["E501"]
# Скрипты развёртывания загружают .env до импорта проекта - это их работа.
"deploy/*.py" = ["E402"]
# Точка входа и модули CRM читают переменные окружения на импорте:
# load_dotenv() обязан отработать раньше этих импортов.
"bot.py" = ["E402"]
"crm/*.py" = ["E402"]
# Hoplite outreach stack — длинные шаблоны/URL и короткие лямбда-имена в list-comp
# исторически не линтились под E741/E501/B9xx; покрываем игнорами чтобы не трогать логику.
"handlers/offers.py" = ["E741"]
"handlers/outreach.py" = ["E501", "E741"]
"handlers/tg_leads.py" = ["E741", "B905"]
"services/classifier.py" = ["E501"]
"services/crm.py" = ["E501", "B905"]
"services/demo_site.py" = ["E501", "E741", "B905"]
"services/offers.py" = ["E501", "B904", "B905"]
"services/orders_service.py" = ["B905"]
"services/outreach.py" = ["E501"]
"tests/test_offers.py" = ["E501"]
"tests/test_outreach.py" = ["E501", "E741"]
