name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt -c requirements.lock
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q --cov=. --cov-report=term --cov-fail-under=60

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependency audit
        run: pip install pip-audit==2.10.0 && pip-audit -r requirements.lock --progress-spinner off
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Shell syntax
        run: for f in deploy/*.sh; do bash -n "$f"; done
