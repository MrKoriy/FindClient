# CRM для FindClient — 94-103-1-126.sslip.io
#
# Домен sslip.io даёт имя для голого IP: 94-103-1-126.sslip.io резолвится в
# 94.103.1.126. Сертификат Let's Encrypt на это имя на сервере уже есть, так
# что пароль не идёт по открытому HTTP и покупать домен не нужно.
#
# Авторизация двойная: nginx проверяет пароль и передаёт заголовок Authorization
# наверх, приложение проверяет его ещё раз теми же кредами. Браузер спросит
# один раз, потому что realm совпадает.

server {
    listen 80;
    listen [::]:80;
    server_name 94-103-1-126.sslip.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 94-103-1-126.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/94-103-1-126.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/94-103-1-126.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    auth_basic           "FindClient CRM";
    auth_basic_user_file /etc/nginx/.htpasswd-findclient;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Authorization не затираем: приложение проверяет те же креды.
        proxy_set_header Authorization     $http_authorization;
        proxy_read_timeout 60s;
    }
}
