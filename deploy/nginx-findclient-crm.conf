# CRM для FindClient — отдельный порт 9444
#
# Почему не 443 с именем `crm.94-103-1-126.sslip.io`, как задумывалось:
# certbot на сервере сломан (pyOpenSSL несовместим с cryptography,
# `AttributeError: module 'lib' has no attribute 'GEN_EMAIL'`), выписать
# сертификат на новое имя нечем. Самоподписанный дал бы предупреждение в
# браузере каждый раз, поэтому панель сидит на своём порту и берёт уже
# существующий сертификат на 94-103-1-126.sslip.io — имя совпадает, значит
# предупреждения нет.
#
# Порт уникальный, поэтому конфликт server_name невозможен: имена
# разбираются в пределах конкретного listen-сокета. Это важно, потому что
# голое 94-103-1-126.sslip.io на 443 занято shift-plus.conf, а там
# VLESS-эндпоинт /vless-xhttp -> Xray. Первая версия панели встала на 443 с
# тем же именем и перехватила его.
#
# Когда certbot починят, панель можно перевести на crm.94-103-1-126.sslip.io:443.

server {
    # nginx 1.24: отдельной директивы `http2 on;` нет, она с 1.25.1.
    listen 9444 ssl http2;
    listen [::]:9444 ssl http2;
    server_name 94-103-1-126.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/94-103-1-126.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/94-103-1-126.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic           "FindClient CRM";
    auth_basic_user_file /etc/nginx/.htpasswd-findclient;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Authorization не затираем: приложение проверяет те же креды.
        proxy_set_header Authorization     $http_authorization;
        proxy_read_timeout 60s;
    }
}
