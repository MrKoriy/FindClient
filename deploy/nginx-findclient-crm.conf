# CRM для FindClient - отдельный HTTPS-порт.
#
# Шаблон: install_crm.sh подставляет __CRM_HOSTNAME__ и __CRM_PUBLIC_PORT__
# (переменные CRM_HOSTNAME / CRM_PUBLIC_PORT). Реальные имена и адреса
# сервера в репозиторий не коммитим.
#
# Порт уникальный, поэтому конфликт server_name с другими сайтами на 443
# невозможен: имена разбираются в пределах конкретного listen-сокета.
#
# Аутентификация делегирована приложению (crm/app.py):
# 1) одноразовая ссылка /auth?token=... из Telegram-бота -> серверная сессия;
# 2) cookie crm_session (httpOnly, Secure по X-Forwarded-Proto, отзывается logout);
# 3) HTTP Basic Auth по логину и паролю.

server {
    listen __CRM_PUBLIC_PORT__ ssl http2;
    listen [::]:__CRM_PUBLIC_PORT__ ssl http2;
    server_name __CRM_HOSTNAME__;

    ssl_certificate     /etc/letsencrypt/live/__CRM_HOSTNAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CRM_HOSTNAME__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Одноразовые токены не должны оседать в access-логе.
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_read_timeout 60s;
    }
}
