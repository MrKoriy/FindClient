# CRM для FindClient — crm.94-103-1-126.sslip.io
#
# Имя намеренно с префиксом. Голое `94-103-1-126.sslip.io` уже занято
# `shift-plus.conf`, и это не пустой конфиг: он проксирует /vless-xhttp на
# Xray (127.0.0.1:10085) и / на 127.0.0.1:8080. Первая версия этой панели
# села на то же имя, nginx выбрал её первой (файлы подключаются по алфавиту),
# и VLESS-эндпоинт начал отдавать 401 вместо прокси. Поэтому имя уникальное:
# так столкновение невозможно в принципе, а не «повезло с порядком файлов».
#
# sslip.io отдаёт любой поддомен на тот же IP, сертификат выписывает certbot.

server {
    listen 80;
    listen [::]:80;
    server_name crm.94-103-1-126.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24: отдельной директивы `http2 on;` нет, она с 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crm.94-103-1-126.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/crm.94-103-1-126.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.94-103-1-126.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic           "FindClient CRM";
    auth_basic_user_file /etc/nginx/.htpasswd-findclient;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Authorization не затираем: приложение проверяет те же креды.
        proxy_set_header Authorization     $http_authorization;
        proxy_read_timeout 60s;
    }
}
