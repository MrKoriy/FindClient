# Черновой конфиг для выписки сертификата: только порт 80.
#
# Полный конфиг ссылается на файлы сертификата, которых до первого выпуска
# ещё нет, и `nginx -t` на нём падает. Поэтому установщик сначала ставит этот
# блок, получает сертификат, и только потом кладёт полный.

server {
    listen 80;
    listen [::]:80;
    server_name crm.94-103-1-126.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503;
    }
}
