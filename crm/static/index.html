<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>FindClient CRM: Рассылка и AI Генератор Офферов</title>
<style>
  :root {
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    --radius-sm: 6px;
    --radius: 10px;
    --radius-lg: 14px;
    --radius-full: 9999px;
    --transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Dark Theme (Default) */
  html[data-theme="dark"] {
    --bg-page: #090d16;
    --bg-subtle: #0f172a;
    --bg-card: #131c2e;
    --bg-card-hover: #19253d;
    --bg-input: #0b1324;
    --border: #22324d;
    --border-strong: #334a70;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-dim: #64748b;
    --primary: #3b82f6;
    --primary-hover: #2563eb;
    --primary-active: #1d4ed8;
    --primary-light: rgba(59, 130, 246, 0.15);
    --primary-border: rgba(59, 130, 246, 0.35);
    --ok: #10b981;
    --ok-light: rgba(16, 185, 129, 0.14);
    --ok-border: rgba(16, 185, 129, 0.3);
    --warn: #f59e0b;
    --warn-light: rgba(245, 158, 11, 0.14);
    --warn-border: rgba(245, 158, 11, 0.3);
    --bad: #ef4444;
    --bad-light: rgba(239, 68, 68, 0.14);
    --bad-border: rgba(239, 68, 68, 0.3);
    --purple: #a855f7;
    --purple-light: rgba(168, 85, 247, 0.14);
    --purple-border: rgba(168, 85, 247, 0.3);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.45);
    --shadow-lg: 0 12px 28px rgba(0, 0, 0, 0.6);
  }

  /* Light Theme */
  html[data-theme="light"] {
    --bg-page: #f8fafc;
    --bg-subtle: #f1f5f9;
    --bg-card: #ffffff;
    --bg-card-hover: #f8fafc;
    --bg-input: #ffffff;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-dim: #64748b;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --primary-active: #1e40af;
    --primary-light: #eff6ff;
    --primary-border: #bfdbfe;
    --ok: #059669;
    --ok-light: #ecfdf5;
    --ok-border: #a7f3d0;
    --warn: #d97706;
    --warn-light: #fffbeb;
    --warn-border: #fde68a;
    --bad: #dc2626;
    --bad-light: #fef2f2;
    --bad-border: #fecaca;
    --purple: #9333ea;
    --purple-light: #faf5ff;
    --purple-border: #e9d5ff;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
    background-color: var(--bg-page);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  /* Icon Helpers */
  .icon {
    width: 16px;
    height: 16px;
    stroke-width: 2;
    stroke: currentColor;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    display: inline-block;
    vertical-align: middle;
    flex-shrink: 0;
  }
  .icon-lg { width: 20px; height: 20px; }
  .icon-xl { width: 24px; height: 24px; }

  /* App Shell & Header */
  header {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
    position: sticky;
    top: 0;
    z-index: 40;
    box-shadow: var(--shadow-sm);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--text-primary);
    text-decoration: none;
  }
  .brand-badge {
    background: var(--primary-light);
    color: var(--primary);
    border: 1px solid var(--primary-border);
    padding: 3px 8px;
    border-radius: var(--radius-sm);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  /* Navigation Bar */
  nav.main-nav {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
  }
  nav.main-nav button {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: none;
    border: 1px solid transparent;
    padding: 7px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text-secondary);
    transition: var(--transition);
  }
  nav.main-nav button:hover {
    background: var(--bg-subtle);
    color: var(--text-primary);
  }
  nav.main-nav button:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 1px;
  }
  nav.main-nav button:active {
    transform: translateY(1px);
  }
  nav.main-nav button.active {
    background: var(--primary-light);
    color: var(--primary);
    border-color: var(--primary-border);
    font-weight: 600;
  }
  nav.main-nav button.active-highlight {
    background: var(--purple-light);
    color: var(--purple);
    border-color: var(--purple-border);
    font-weight: 600;
  }

  .header-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .worker-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: var(--radius-full);
    font-size: 12px;
    font-weight: 500;
    border: 1px solid var(--border);
    background: var(--bg-subtle);
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: var(--radius-full);
    background: var(--text-dim);
  }
  .status-dot.active { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .status-dot.warn { background: var(--warn); box-shadow: 0 0 6px var(--warn); }
  .status-dot.bad { background: var(--bad); }

  /* Main Container */
  main {
    padding: 24px;
    max-width: 1440px;
    margin: 0 auto;
    min-height: calc(100vh - 65px);
  }

  /* Metric Cards Grid */
  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }
  .metric-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    position: relative;
    box-shadow: var(--shadow-sm);
    transition: var(--transition);
  }
  .metric-card:hover {
    border-color: var(--border-strong);
    transform: translateY(-1px);
  }
  .metric-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 8px;
  }
  .metric-value {
    font-size: 28px;
    font-weight: 700;
    line-height: 1.1;
    color: var(--text-primary);
    letter-spacing: -0.02em;
  }
  .metric-sub {
    color: var(--text-secondary);
    font-size: 12px;
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* Panels and Sections */
  .panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: var(--shadow-sm);
  }
  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .panel-title {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-subtitle {
    color: var(--text-secondary);
    font-size: 13px;
    margin-top: 2px;
  }

  /* Controls & Inputs */
  .row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  input, select, textarea {
    font-family: inherit;
    font-size: 13.5px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg-input);
    color: var(--text-primary);
    transition: var(--transition);
    outline: none;
  }
  input:hover, select:hover, textarea:hover {
    border-color: var(--border-strong);
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-light);
  }
  input:disabled, select:disabled, textarea:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  textarea {
    width: 100%;
    min-height: 100px;
    line-height: 1.55;
    resize: vertical;
  }

  /* Buttons (All 8 states handled, high contrast & WebView immune) */
  button.btn, .btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition: var(--transition);
    user-select: none;
    -webkit-appearance: none !important;
    appearance: none !important;
    box-sizing: border-box !important;
    text-decoration: none !important;
  }
  button.btn:focus-visible, .btn:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 2px;
  }
  button.btn:active:not(:disabled), .btn:active:not(:disabled) {
    transform: translateY(1px);
  }
  button.btn:disabled, .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  button.btn-primary, .btn-primary {
    background: #2563eb !important;
    background-color: #2563eb !important;
    color: #ffffff !important;
    border-color: #1d4ed8 !important;
    font-weight: 600 !important;
  }
  button.btn-primary *, .btn-primary * {
    color: #ffffff !important;
    stroke: #ffffff !important;
    fill: none !important;
  }
  button.btn-primary:hover:not(:disabled), .btn-primary:hover:not(:disabled) {
    background: #1d4ed8 !important;
  }
  button.btn-primary:active:not(:disabled), .btn-primary:active:not(:disabled) {
    background: #1e40af !important;
  }

  button.btn-secondary, .btn-secondary {
    background: #1e293b !important;
    background-color: #1e293b !important;
    border-color: #334155 !important;
    color: #f8fafc !important;
    font-weight: 500 !important;
  }
  button.btn-secondary *, .btn-secondary * {
    color: #f8fafc !important;
    stroke: #f8fafc !important;
  }
  button.btn-secondary:hover:not(:disabled), .btn-secondary:hover:not(:disabled) {
    background: #334155 !important;
    border-color: #475569 !important;
  }
  html[data-theme="light"] button.btn-secondary,
  html[data-theme="light"] .btn-secondary {
    background: #f1f5f9 !important;
    background-color: #f1f5f9 !important;
    border-color: #cbd5e1 !important;
    color: #0f172a !important;
  }
  html[data-theme="light"] button.btn-secondary *,
  html[data-theme="light"] .btn-secondary * {
    color: #0f172a !important;
    stroke: #0f172a !important;
  }

  button.btn-purple, .btn-purple {
    background: #8b5cf6 !important;
    background-color: #8b5cf6 !important;
    color: #ffffff !important;
    border-color: #7c3aed !important;
    font-weight: 600 !important;
  }
  button.btn-purple *, .btn-purple * {
    color: #ffffff !important;
    stroke: #ffffff !important;
    fill: none !important;
  }
  button.btn-purple:hover:not(:disabled), .btn-purple:hover:not(:disabled) {
    opacity: 0.92;
  }

  button.btn-danger, .btn-danger {
    background: var(--bad-light);
    color: var(--bad);
    border-color: var(--bad-border);
  }
  button.btn-danger:hover:not(:disabled), .btn-danger:hover:not(:disabled) {
    background: var(--bad);
    color: #ffffff;
  }

  button.btn-sm, .btn-sm {
    padding: 5px 10px;
    font-size: 12px;
    gap: 5px;
  }

  /* Tables */
  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    text-align: left;
  }
  th {
    background: var(--bg-subtle);
    color: var(--text-dim);
    font-weight: 600;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    color: var(--text-primary);
  }
  tr:last-child td { border-bottom: 0; }
  tr:hover td { background: var(--bg-subtle); }

  /* Badges and Tags */
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: var(--radius-full);
    font-size: 11.5px;
    font-weight: 500;
    line-height: 1;
    border: 1px solid transparent;
  }
  .tag-dot {
    width: 6px;
    height: 6px;
    border-radius: var(--radius-full);
    background: currentColor;
  }
  .s-new { background: var(--bg-subtle); color: var(--text-secondary); border-color: var(--border); }
  .s-queued { background: var(--warn-light); color: var(--warn); border-color: var(--warn-border); }
  .s-sent { background: var(--primary-light); color: var(--primary); border-color: var(--primary-border); }
  .s-replied { background: var(--ok-light); color: var(--ok); border-color: var(--ok-border); }
  .s-refused { background: var(--bad-light); color: var(--bad); border-color: var(--bad-border); }
  .s-blocked { background: var(--bad-light); color: var(--bad); border-color: var(--bad-border); }
  .s-skip { background: var(--bg-subtle); color: var(--text-dim); border-color: var(--border); }

  /* Typography Utilities */
  .mono { font-family: var(--font-mono); font-size: 12px; }
  .dim { color: var(--text-secondary); }
  .text-dim { color: var(--text-dim); }
  .ok { color: var(--ok); }
  .warn { color: var(--warn); }
  .bad { color: var(--bad); }
  .purple { color: var(--purple); }
  .spacer { flex: 1; }

  /* Alert Callouts */
  .callout {
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-left: 4px solid var(--primary);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    margin-bottom: 18px;
    font-size: 13.5px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .callout-warn {
    border-left-color: var(--warn);
    background: var(--warn-light);
    color: var(--text-primary);
  }
  .callout-bad {
    border-left-color: var(--bad);
    background: var(--bad-light);
    color: var(--text-primary);
  }
  .callout-ok {
    border-left-color: var(--ok);
    background: var(--ok-light);
    color: var(--text-primary);
  }

  /* ========================================================================= */
  /* Offer Studio Redesign (Mobile-First, Streamlined AI Workflow)             */
  /* ========================================================================= */

  .offer-studio-shell {
    max-width: 1040px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* Compact Hero Header */
  .offer-hero-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .offer-title-group h1 {
    font-size: 18px;
    font-weight: 700;
    margin: 0 0 2px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .offer-title-group .dim {
    font-size: 12px;
  }
  .offer-model-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-full);
    padding: 4px 10px;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .offer-model-pill select {
    background: transparent;
    border: none;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-primary);
    padding: 0;
    cursor: pointer;
    outline: none;
  }

  /* Active Target Card */
  .offer-target-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    box-shadow: var(--shadow-sm);
    transition: var(--transition);
  }
  .offer-target-card:hover {
    border-color: var(--border-strong);
  }
  .target-card-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .target-card-info {
    flex: 1;
    min-width: 0;
  }
  .target-card-title-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 3px;
    flex-wrap: wrap;
  }
  .target-card-name {
    font-weight: 700;
    font-size: 14.5px;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 240px;
  }
  .target-card-meta {
    font-size: 12px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .target-badge-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: var(--radius-full);
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    color: var(--text-secondary);
  }
  .target-badge-pill.tg-ok {
    background: var(--ok-light);
    color: var(--ok);
    border-color: var(--ok);
  }
  .target-badge-pill.star-pill {
    background: var(--warn-light);
    color: var(--warn);
    border-color: var(--warn);
  }

  /* Strategy Horizontal Scroll Chips */
  .strategy-scroll-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: 2px 2px 4px;
    margin: -2px -2px 0;
  }
  .strategy-scroll-wrap::-webkit-scrollbar {
    display: none;
  }
  .strategy-chip {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-full);
    padding: 8px 14px;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    transition: var(--transition);
    min-height: 40px;
  }
  .strategy-chip:hover {
    border-color: var(--border-strong);
    color: var(--text-primary);
  }
  .strategy-chip.selected {
    background: var(--purple-light);
    border-color: var(--purple);
    color: var(--purple);
    font-weight: 600;
    box-shadow: 0 0 0 1px var(--purple);
  }

  /* Prompt Hint & Link Bar (Clean 2-Row Responsive Card) */
  .prompt-hint-bar {
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    box-shadow: var(--shadow-sm);
  }
  .prompt-hint-input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
  }
  .prompt-hint-input-row input {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    font-size: 13.5px;
    padding: 4px 0;
    outline: none;
    color: var(--text-primary);
  }
  .prompt-hint-input-row input::placeholder {
    color: var(--text-dim);
  }
  .prompt-hint-actions-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding-top: 6px;
    border-top: 1px solid var(--border);
  }
  .prompt-hint-link-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-secondary);
    cursor: pointer;
    user-select: none;
    padding: 4px 8px;
    border-radius: var(--radius-sm);
    background: var(--bg-subtle);
    border: 1px solid var(--border);
  }

  /* Main Responsive Studio Layout */
  .studio-layout {
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .studio-layout {
      grid-template-columns: 1fr;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

  /* Candidate Variant Tabs (Segmented Control) */
  .candidate-tabs-bar {
    display: flex;

    border-radius: var(--radius-full);

    transition: var(--transition);

    align-items: center;
    justify-content: center;
    gap: 6px;
    user-select: none;
    font-size: 12px;
    font-weight: 600;

  .candidate-tab-pill:hover {

    color: var(--text-primary);

  .candidate-tab-pill.active {

  .candidate-tab-pill .cand-badge.winner {

    color: var(--ok);

  .candidate-tab-pill.active .cand-badge.winner {
    background: var(--ok);
    color: #ffffff;

  /* Chat Preview Shell (Telegram-Style Message Bubble) */
  .chat-preview-shell {
    background: var(--bg-card);

    border-radius: var(--radius-lg);

    justify-content: center;

  /* Prominent Score Badge in Header */
  .bubble-score-badge {

  /* Jev Judge Widget */
  .jev-judge-widget {

  .jev-score-circle {

  .score-excellent { color: var(--ok); background: var(--ok-light); border-color: var(--ok); }
  .score-good { color: var(--primary); background: var(--primary-light); border-color: var(--primary); }
  .score-needs_work { color: var(--warn); background: var(--warn-light); border-color: var(--warn); }

  .dim-meters-grid {

  .jev-accordion-btn {

    display: none;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);

  .checklist {

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .spin {
    display: inline-block;
    animation: spin 0.9s linear infinite;
  }
  @keyframes flashPulse {
    0% { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
    100% { border-color: var(--border); box-shadow: none; }
  }
  .flash-highlight {
    animation: flashPulse 1s ease-out;
  }

  /* Modals */
  dialog {
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-lg);
    background: var(--bg-card);
    color: var(--text-primary);

    width: 94%;
    box-shadow: var(--shadow-lg);

    background: rgba(0, 0, 0, 0.6);

  .modal-head {

    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

    padding: 20px;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal-foot {
    padding: 14px 20px;
    border-top: 1px solid var(--border);

    align-items: center;
    justify-content: flex-end;

  /* Toast Notification */
  #toastContainer {
    position: fixed;

    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  .toast {

    color: var(--text-primary);

    border-radius: var(--radius);

    font-weight: 500;
    box-shadow: var(--shadow-md);

    align-items: center;
    gap: 8px;
    pointer-events: auto;
    animation: toastIn 0.2s ease-out;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ----------------------------------------------------------------------- */
  /* Mobile Responsive Design System (Mobile-First / Telegram WebApp)        */
  /* ----------------------------------------------------------------------- */

  .mobile-tabbar {
    display: none;
  }
  .bottom-sheet-backdrop {
    display: none;
  }
  .loader-spinner {
    width: 28px;
    height: 28px;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @media (max-width: 860px) {

    .desktop-nav {

    header {

    main {

      stroke: var(--purple);

    /* Bottom Sheet Modal for More Menu */
    .bottom-sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 200;
      display: flex;
      align-items: flex-end;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    .bottom-sheet {
      width: 100%;
      background: var(--bg-card);
      border-top: 1px solid var(--border-strong);
      border-radius: 18px 18px 0 0;
      padding: 12px 16px calc(24px + env(safe-area-inset-bottom, 16px)) 16px;
      max-height: 82vh;
      overflow-y: auto;

    .bottom-sheet-handle {

      font-weight: 700;
      color: var(--text-primary);

    .bottom-sheet-list {

      flex-direction: column;

    .sheet-item {

    }
    .sheet-item:hover, .sheet-item:active {
      background: var(--bg-card-hover);
      border-color: var(--border-strong);
    }
    .sheet-item-danger {
      color: var(--bad);
      border-color: var(--bad-border);
      background: var(--bad-light);
    }
    .sheet-icon {
      width: 20px;
      height: 20px;

      font-size: 13.5px;

    }
    .sheet-sub {
      font-size: 11.5px;

      margin-top: 2px;
    }

    /* Prevent iOS Auto-Zoom on form controls */
    input, select, textarea {

    }

    /* Mobile Metrics Grid */

    /* Offer Studio Mobile Reflow */
    .studio-layout {

    /* Table Horizontal Swipe */
    .table-wrap {

    }
    table th, table td {

  }

  @media (max-width: 480px) {
    .metrics-grid {
      grid-template-columns: repeat(2, 1fr) !important;
    }
    .row {
      flex-direction: column;
      align-items: stretch;

<script>
// --------------------------------------------------------------------------
// Icons & Setup
// --------------------------------------------------------------------------
const ICONS = {
  dash: '<svg class="icon" viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>',
  targets: '<svg class="icon" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  offers: '<svg class="icon" viewBox="0 0 24 24"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>',
  groups: '<svg class="icon" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>',
  log: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
  tpl: '<svg class="icon" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>',
  set: '<svg class="icon" viewBox="0 0 24 24"><line x1="4" x2="20" y1="21" y2="21"/><line x1="4" x2="20" y1="7" y2="7"/><line x1="4" x2="20" y1="14" y2="14"/><circle cx="17" cy="7" r="2"/><circle cx="9" cy="14" r="2"/><circle cx="14" cy="21" r="2"/></svg>',
  check: '<svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>',
  alert: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
  copy: '<svg class="icon" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>',
  send: '<svg class="icon" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>',
  star: '<svg class="icon" viewBox="0 0 24 24" style="color:#f59e0b;fill:#f59e0b"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
  sparkles: '<svg class="icon" viewBox="0 0 24 24"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>',
  chevronDown: '<svg class="icon" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
  refresh: '<svg class="icon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>',
  edit: '<svg class="icon" viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>',
  building: '<svg class="icon" viewBox="0 0 24 24"><rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M8 10h.01"/><path d="M16 10h.01"/><path d="M8 14h.01"/><path d="M16 14h.01"/></svg>',
  search: '<svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>',
  bot: '<svg class="icon" viewBox="0 0 24 24"><rect width="18" height="12" x="3" y="6" rx="2"/><line x1="12" x2="12" y1="2" y2="6"/><line x1="8" x2="8" y1="18" y2="22"/><line x1="16" x2="16" y1="18" y2="22"/></svg>'
};

const VIEWS = [
  ["dash", "Сводка", ICONS.dash],
  ["targets", "Цели", ICONS.targets],
  ["offers", "Офферы (AI+Jev)", ICONS.offers, true],
  ["groups", "Группы", ICONS.groups],
  ["log", "Журнал", ICONS.log],
  ["tpl", "Шаблоны", ICONS.tpl],
  ["set", "Настройки", ICONS.set]
];

const STATUS_LABELS = {
  new: "Не писали", queued: "В очереди", sent: "Отправлено", replied: "Ответил",
  refused: "Отказ", blocked: "Блок / жалоба", skip: "Не наш случай"
};

let current = location.hash.slice(1) || "dash";

// Token & Telegram WebApp Initialization
const _urlParams = new URLSearchParams(window.location.search);
const _tokenParam = _urlParams.get("token");
if (_tokenParam) {
  localStorage.setItem("crm_token", _tokenParam);
  const _clean = window.location.pathname + window.location.hash;
  window.history.replaceState({}, document.title, _clean);
}

if (window.Telegram && window.Telegram.WebApp) {
  try {
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    if (tg.enableClosingConfirmation) tg.enableClosingConfirmation();
  } catch (_) {}
}

// API Wrapper with X-CRM-Token and credentials include
const api = {
  _headers() {
    const h = { "Content-Type": "application/json" };
    const tok = localStorage.getItem("crm_token");
    if (tok) h["X-CRM-Token"] = tok;
    return h;
  },
  async get(p) {
    const r = await fetch(p, {
      credentials: "include",
      headers: this._headers(),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      throw new Error(err.error || r.statusText || ("HTTP " + r.status));
    }
    return r.json();
  },
  async send(p, body, method = "POST") {
    const r = await fetch(p, {
      method,
      credentials: "include",
      headers: this._headers(),
      body: body === undefined ? undefined : JSON.stringify(body)
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || r.statusText || ("HTTP " + r.status));
    return j;
  }
};

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = n => (n ?? 0).toLocaleString("ru-RU");
const tag = s => `<span class="tag s-${esc(s)}"><span class="tag-dot"></span>${esc(STATUS_LABELS[s] || s)}</span>`;

function toast(msg, type = "info") {
  const container = document.getElementById("toastContainer");
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `${ICONS.check} <span>${esc(msg)}</span>`;
  container.appendChild(el);
  setTimeout(() => {
    el.style.opacity = "0";
    el.style.transition = "opacity 0.3s ease";
    setTimeout(() => el.remove(), 300);
  }, 3200);
}

function modal(title, html, footer = "") {
  const d = document.getElementById("modalDialog");
  document.getElementById("modalContent").innerHTML = `
    <div class="modal-head">
      <h3 style="margin:0;font-size:16px">${esc(title)}</h3>
      <button class="btn btn-secondary btn-sm" onclick="closeModal()">Закрыть</button>
    </div>
    <div class="modal-body">${html}</div>
    ${footer ? `<div class="modal-foot">${footer}</div>` : ""}
  `;
  d.showModal();
}
function closeModal() { document.getElementById("modalDialog").close(); }
document.getElementById("modalDialog").addEventListener("click", e => {
  if (e.target.id === "modalDialog") closeModal();
});

// Theme Management
function initTheme() {
  const saved = localStorage.getItem("findclient_theme") || "dark";
  document.documentElement.setAttribute("data-theme", saved);
  document.getElementById("themeToggle").onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("findclient_theme", next);
  };
}
initTheme();

// Bottom Sheet Helpers
function openMoreSheet() {
  document.getElementById("moreSheetBackdrop").style.display = "flex";
}
function closeMoreSheet() {
  document.getElementById("moreSheetBackdrop").style.display = "none";
}
document.getElementById("closeMoreSheet").onclick = closeMoreSheet;
document.getElementById("moreSheetBackdrop").addEventListener("click", e => {
  if (e.target.id === "moreSheetBackdrop") closeMoreSheet();
});
document.getElementById("moreSheet").addEventListener("click", e => {
  const b = e.target.closest("[data-go]");
  if (b) {
    closeMoreSheet();
    current = b.dataset.go;
    location.hash = current;
    route();
  }
});

// Navigation Render (Desktop + Mobile TabBar)
function renderNav() {
  // 1. Desktop Nav
  const desktopNav = document.getElementById("mainNav");
  if (desktopNav) {
    desktopNav.innerHTML = VIEWS.map(([id, label, icon, highlight]) =>
      `<button data-go="${id}" class="${id === current ? (highlight ? 'active-highlight' : 'active') : ''}">
        ${icon} <span>${label}</span>
      </button>`
    ).join("");
  }

  // 2. Mobile Tab Bar (dash, targets, offers, log, more)
  const tabDash = document.querySelector('#mobileTabBar [data-go="dash"]');
  const tabTargets = document.querySelector('#mobileTabBar [data-go="targets"]');
  const tabOffers = document.querySelector('#mobileTabBar [data-go="offers"]');
  const tabLog = document.querySelector('#mobileTabBar [data-go="log"]');
  const tabMore = document.getElementById("btnMobileMore");
  const moreLabel = document.getElementById("mobileMoreLabel");

  if (tabDash) tabDash.className = "tab-item" + (current === "dash" ? " active" : "");
  if (tabTargets) tabTargets.className = "tab-item" + (current === "targets" ? " active" : "");
  if (tabOffers) tabOffers.className = "tab-item tab-highlight" + (current === "offers" ? " active-purple" : "");
  if (tabLog) tabLog.className = "tab-item" + (current === "log" ? " active" : "");

  const moreMap = { groups: "Группы", tpl: "Шаблоны", set: "Настройки" };
  if (tabMore && moreLabel) {
    if (moreMap[current]) {
      tabMore.className = "tab-item active";
      moreLabel.textContent = moreMap[current];
    } else {
      tabMore.className = "tab-item";
      moreLabel.textContent = "Ещё";
    }
  }
}

document.getElementById("mainNav").addEventListener("click", e => {
  const b = e.target.closest("[data-go]"); if (!b) return;
  current = b.dataset.go; location.hash = current; route();
});

document.getElementById("mobileTabBar").addEventListener("click", e => {
  const b = e.target.closest("[data-go]");
  if (b) {
    current = b.dataset.go;
    location.hash = current;
    route();
    return;
  }
  if (e.target.closest("#btnMobileMore")) {
    openMoreSheet();
  }
});

window.addEventListener("hashchange", () => {
  current = location.hash.slice(1) || "dash"; route();
});

// Router
async function route() {
  renderNav();
  const v = document.getElementById("appView");
  v.innerHTML = `
    <div class="panel" style="text-align:center;padding:48px 16px">
      <div class="loader-spinner" style="margin:0 auto 12px auto"></div>
      <div style="font-weight:500;color:var(--text-secondary);font-size:13.5px">Загрузка данных...</div>
    </div>`;
  try {
    if (current === "dash") await viewDash(v);
    else if (current === "targets") await viewTargets(v);
    else if (current === "offers") await viewOffers(v);
    else if (current === "groups") await viewGroups(v);
    else if (current === "log") await viewLog(v);
    else if (current === "tpl") await viewTemplates(v);
    else if (current === "set") await viewSettings(v);
    updateWorkerIndicator();
  } catch (e) {
    v.innerHTML = `
      <div class="panel" style="padding:20px;border-color:var(--bad-border)">
        <div class="callout callout-bad" style="margin-bottom:14px">
          ${ICONS.alert}
          <div>
            <b>Ошибка при загрузке:</b> ${esc(e.message)}
          </div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="route()">Повторить попытку</button>
          <button class="btn btn-secondary" onclick="location.href='/auth/logout'">Сбросить сессию</button>
        </div>
      </div>`;
  }
}

async function updateWorkerIndicator() {
  try {
    const s = await api.get("/api/summary");
    const dot = document.getElementById("workerDot");
    const txt = document.getElementById("workerText");
    if (!s.enabled) {
      dot.className = "status-dot bad";
      txt.textContent = "Воркер выкл.";
    } else if (s.dry_run) {
      dot.className = "status-dot warn";
      txt.textContent = "Холостой ход";
    } else {
      dot.className = "status-dot active";
      txt.textContent = `Воркер активен (${s.sent_today}/${s.daily_cap})`;
    }
  } catch {}
}

// --------------------------------------------------------------------------
// View: Dashboard (Сводка)
// --------------------------------------------------------------------------
async function viewDash(v) {
  const s = await api.get("/api/summary");
  const convRate = s.targets.sent > 0
    ? ((s.targets.replied / s.targets.sent) * 100).toFixed(1) + "%"
    : "0.0%";

  v.innerHTML = `
  <div class="metrics-grid">
    <div class="metric-card">
      <div class="metric-head"><span>Не тронуто</span>${ICONS.targets}</div>
      <div class="metric-value">${num(s.targets.new)}</div>
      <div class="metric-sub">рабочих целей без сайта</div>
    </div>
    <div class="metric-card">
      <div class="metric-head"><span>Отправлено сегодня</span>${ICONS.send}</div>
      <div class="metric-value">${num(s.sent_today)} <span class="text-dim" style="font-size:16px">/ ${num(s.daily_cap)}</span></div>
      <div class="metric-sub">дневной лимит аккаунта</div>
    </div>
    <div class="metric-card">
      <div class="metric-head"><span>Осталось на сегодня</span>${ICONS.log}</div>
      <div class="metric-value ok">${num(s.left_today)}</div>
      <div class="metric-sub">сообщений до ночи</div>
    </div>
    <div class="metric-card">
      <div class="metric-head"><span>В очереди</span>${ICONS.dash}</div>
      <div class="metric-value warn">${num(s.queued)}</div>
      <div class="metric-sub">ожидают воркера</div>
    </div>
    <div class="metric-card">
      <div class="metric-head"><span>Ответили</span>${ICONS.check}</div>
      <div class="metric-value purple">${num(s.targets.replied)}</div>
      <div class="metric-sub">конверсия: <b>${convRate}</b></div>
    </div>
    <div class="metric-card">
      <div class="metric-head"><span>Группы</span>${ICONS.groups}</div>
      <div class="metric-value">${num(s.groups_posted)} <span class="text-dim" style="font-size:16px">/ ${num(s.groups_total)}</span></div>
      <div class="metric-sub">чатов отработано</div>
    </div>
  </div>

  ${!s.enabled ? `
    <div class="callout callout-warn">
      ${ICONS.alert}
      <div>
        <b>Отправка сообщений выключена.</b> Воркер находится в режиме ожидания.
        Чтобы включить, перейдите в <a href="#set" style="color:inherit;font-weight:600">Настройки</a> и отметьте «Отправка разрешена».
      </div>
    </div>` : ""}

  ${s.dry_run && s.enabled ? `
    <div class="callout callout-warn">
      ${ICONS.alert}
      <div>
        <b>Включен холостой ход.</b> Воркер считывает очередь и пишет отправки в журнал, но реальные сообщения в Telegram не отправляются.
      </div>
    </div>` : ""}

  <div class="studio-grid">
    <div class="panel">
      <div class="panel-header">
        <div>
          <h2 class="panel-title">${ICONS.targets} Воронка и статусы целей</h2>
          <div class="panel-subtitle">Распределение базы по этапам контакта</div>
        </div>
        <button class="btn btn-secondary btn-sm" id="btnImportDash">Подтянуть из базы</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Этап</th><th>Количество</th><th>Доля</th></tr></thead>
          <tbody>
            ${Object.keys(STATUS_LABELS).map(k => {
              const count = s.targets[k] || 0;
              const pct = s.targets.all > 0 ? ((count / s.targets.all) * 100).toFixed(1) + "%" : "0%";
              return `<tr>
                <td>${tag(k)}</td>
                <td><b>${num(count)}</b></td>
                <td class="dim">${pct}</td>
              </tr>`;
            }).join("")}
            <tr style="background:var(--bg-subtle)">
              <td><b>Всего в базе</b></td>
              <td><b>${num(s.targets.all)}</b></td>
              <td>100%</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div>
          <h2 class="panel-title">${ICONS.sparkles} Быстрые действия и навыки</h2>
          <div class="panel-subtitle">Ключевые сценарии работы с лидами</div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm)">
          <div style="background:var(--purple-light);color:var(--purple);padding:8px;border-radius:var(--radius-sm)">${ICONS.offers}</div>
          <div>
            <div style="font-weight:600;margin-bottom:2px">Генератор оффера (AI + Jev Judge)</div>
            <div class="dim" style="font-size:12.5px;margin-bottom:8px">Составьте персональное холодное сообщение и проверьте его через классификатор качества Jev.</div>
            <button class="btn btn-purple btn-sm" onclick="location.hash='offers'">Открыть генератор</button>

// Quick Target Preview Modal
async function openTargetQuickModal(id) {
  const { items } = await api.get("/api/targets?limit=1000");
  const t = items.find(x => x.id === id);
  if (!t) return;
  const tpls = (await api.get("/api/templates")).items;
  const tplOpts = tpls.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join("");

  modal(t.name || "Цель", `
    <div class="dim" style="margin-bottom:14px;font-size:13px">
      ${esc(t.category) || "Без категории"} · ${esc(t.city) || "Город не указан"} · ${esc(t.phone) || "Нет телефона"}
      ${t.address ? `<br>${esc(t.address)}` : ""}
    </div>

    <div class="row" style="margin-bottom:12px">
      <label class="dim" style="display:flex;align-items:center;gap:6px">@
        <input id="modalUname" value="${esc(t.username)}" placeholder="username_в_telegram" style="width:200px">
      </label>
      <button class="btn btn-secondary btn-sm" id="btnSaveUname">Сохранить @</button>
      <div class="spacer"></div>
      <select id="modalTplSel">${tplOpts}</select>
      <label class="dim" style="display:flex;align-items:center;gap:6px">
        <input type="checkbox" id="modalWithLink"> со ссылкой
      </label>
    </div>

    <div id="modalProblems" style="margin-bottom:10px"></div>
    <div style="background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;white-space:pre-wrap;line-height:1.55;font-size:13.5px;min-height:80px" id="modalPreviewBox">Загрузка...</div>
  `, `
    <select id="modalStatusSel" style="margin-right:auto">
      ${Object.entries(STATUS_LABELS).map(([k, l]) => `<option value="${k}" ${k === t.status ? "selected" : ""}>${esc(l)}</option>`).join("")}
    </select>
    <button class="btn btn-secondary" id="btnSaveStatus">Сохранить статус</button>
    <button class="btn btn-secondary" id="btnCopyText">${ICONS.copy} Скопировать</button>
    <button class="btn btn-primary" id="btnQueueModal">${ICONS.send} В очередь</button>
  `);

  let renderedText = "";
  async function refreshPreview() {
    const tid = document.getElementById("modalTplSel").value;
    const wl = document.getElementById("modalWithLink").checked ? "1" : "0";
    const r = await api.get(`/api/preview?target_id=${id}&template_id=${tid}&with_link=${wl}`);
    renderedText = r.text;
    document.getElementById("modalPreviewBox").textContent = r.text;
    document.getElementById("modalProblems").innerHTML = r.problems.length
      ? `<div class="callout callout-warn" style="padding:8px 12px;margin:0">${ICONS.alert} <div>Замечания: ${r.problems.map(esc).join("; ")}</div></div>`
      : `<div class="callout callout-ok" style="padding:8px 12px;margin:0">${ICONS.check} <div>Без замечаний · ${r.words} слов</div></div>`;
  }

  document.getElementById("modalTplSel").onchange = refreshPreview;
  document.getElementById("modalWithLink").onchange = refreshPreview;

  document.getElementById("btnSaveUname").onclick = async () => {
    const val = document.getElementById("modalUname").value.trim().replace(/^@/, "");
    await api.send(`/api/targets/${id}/username`, { username: val });
    toast("Юзернейм сохранен");
  };
  document.getElementById("btnCopyText").onclick = async () => {
    await navigator.clipboard.writeText(renderedText);
    toast("Скопировано в буфер");
  };
  document.getElementById("btnQueueModal").onclick = async () => {
    if (!renderedText) return;
    try {
      await api.send("/api/queue", { target_id: id, body: renderedText, kind: "dm" });
      toast("Сообщение добавлено в очередь!");
      closeModal(); route();
    } catch (e) { alert(e.message); }
  };
  document.getElementById("btnSaveStatus").onclick = async () => {
    const st = document.getElementById("modalStatusSel").value;
    await api.send(`/api/targets/${id}/status`, { status: st });
    toast("Статус обновлен");
    closeModal(); route();
  };

  refreshPreview();
}

            ${ICONS.targets} Выбрать из базы (${targets.length})
          </button>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
          <div>
            <label style="font-size:11px;font-weight:600;color:var(--text-secondary);display:block;margin-bottom:2px">Компания:</label>
            <input id="manualName" value="${esc(manualData.name)}" style="width:100%;font-size:13px;padding:6px 8px">
          </div>
          <div>
            <label style="font-size:11px;font-weight:600;color:var(--text-secondary);display:block;margin-bottom:2px">Сфера:</label>
            <input id="manualCategory" value="${esc(manualData.category)}" style="width:100%;font-size:13px;padding:6px 8px">
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
          <div>
            <label style="font-size:11px;font-weight:600;color:var(--text-secondary);display:block;margin-bottom:2px">Город:</label>
            <input id="manualCity" value="${esc(manualData.city)}" style="width:100%;font-size:13px;padding:6px 8px">
          </div>
          <div>
            <label style="font-size:11px;font-weight:600;color:var(--text-secondary);display:block;margin-bottom:2px">Рейтинг:</label>
            <input id="manualRating" value="${esc(manualData.rating)}" style="width:100%;font-size:13px;padding:6px 8px">
          </div>
          <div>
            <label style="font-size:11px;font-weight:600;color:var(--text-secondary);display:block;margin-bottom:2px">Отзывов:</label>
            <input id="manualReviews" value="${esc(manualData.reviews)}" style="width:100%;font-size:13px;padding:6px 8px">
          </div>
        </div>
      `;
      const btnDb = card.querySelector("#btnSwitchToDbTargets");
      if (btnDb) {
        btnDb.onclick = () => showTargetPicker();
      }
      return;
    }

    const t = targets.find(x => x.id === activeTargetId);
    if (!t) {
      isManualMode = true;
      renderTargetCard();
      return;
    }

    card.innerHTML = `
      <div class="target-card-row">
        <div class="target-card-info">
          <div class="target-card-title-row">
            <span class="target-card-name" title="${esc(t.name)}">${esc(t.name)}</span>
            ${t.username ? `<span class="target-badge-pill tg-ok">@${esc(t.username)}</span>` : '<span class="target-badge-pill">без tg</span>'}
            ${t.rating > 0 ? `<span class="target-badge-pill star-pill">${ICONS.star} ${t.rating}</span>` : ''}
          </div>
          <div class="target-card-meta">
            <span>${esc(t.category || "Сфера не указ.")}</span>
            <span>·</span>
            <span>${esc(t.city || "Город не указ.")}</span>
            ${t.reviews ? `<span>· ${num(t.reviews)} отз.</span>` : ''}
          </div>
        </div>
        <div class="target-card-actions">
          <button class="btn btn-secondary btn-sm" id="btnChangeTarget" title="Выбрать другую цель">
            ${ICONS.refresh} <span>Сменить</span>
          </button>
        </div>
      </div>
    `;

    const btnChange = card.querySelector("#btnChangeTarget");
    if (btnChange) {
      btnChange.onclick = () => showTargetPicker();
    }
  }

  // Target Picker Modal with Real-time Filter
  function showTargetPicker() {
    let filterQuery = "";

    function renderPickerList() {
      const container = document.getElementById("targetPickerList");
      if (!container) return;
      const q = filterQuery.toLowerCase().trim();
      const filtered = targets.filter(t => {
        if (!q) return true;
        return (t.name && t.name.toLowerCase().includes(q)) ||
               (t.category && t.category.toLowerCase().includes(q)) ||
               (t.city && t.city.toLowerCase().includes(q)) ||
               (t.username && t.username.toLowerCase().includes(q));
      });

      if (!filtered.length) {
        container.innerHTML = `<div class="dim" style="padding:16px;text-align:center">Компании не найдены по запросу «${esc(q)}»</div>`;
        return;
      }

      container.innerHTML = filtered.slice(0, 100).map(t => `
        <button class="target-picker-item ${t.id === activeTargetId ? 'selected' : ''}" data-target-id="${t.id}">
          <div style="min-width:0;flex:1">
            <div style="font-weight:600;font-size:13.5px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
              ${esc(t.name)}
            </div>
            <div style="font-size:11.5px;color:var(--text-secondary);margin-top:2px">
              ${esc(t.category || "без сферы")} · ${esc(t.city || "город не указ.")}
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
            ${t.rating > 0 ? `<span class="target-badge-pill star-pill">${ICONS.star} ${t.rating}</span>` : ''}
            ${t.username ? `<span class="target-badge-pill tg-ok">@${esc(t.username)}</span>` : '<span class="target-badge-pill">без tg</span>'}
          </div>
        </button>
      `).join("");

      container.querySelectorAll(".target-picker-item").forEach(item => {
        item.onclick = () => {
          activeTargetId = +item.dataset.targetId;
          isManualMode = false;
          closeModal();
          renderTargetCard();
          doGenerate();
        };
      });
    }

    const modalBody = `
      <div style="display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;gap:8px">
          <input id="targetPickerFilter" placeholder="Поиск компании, сферы или города..." style="flex:1" autofocus>
          <button class="btn btn-secondary btn-sm" id="btnManualModeInPicker">Ручной ввод</button>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span class="dim" style="font-size:12px">Всего в базе: ${targets.length} компаний</span>
          <button class="btn btn-secondary btn-sm" id="btnSeedDemoInPicker">${ICONS.sparkles} +5 демо-целей</button>
        </div>
        <div class="target-picker-list" id="targetPickerList"></div>
      </div>
    `;

    modal("Выбор компании для оффера", modalBody);
    renderPickerList();

    const filterInput = document.getElementById("targetPickerFilter");
    if (filterInput) {
      filterInput.oninput = () => {
        filterQuery = filterInput.value;
        renderPickerList();
      };
    }

    const btnManual = document.getElementById("btnManualModeInPicker");
    if (btnManual) {
      btnManual.onclick = () => {
        isManualMode = true;
        activeTargetId = null;
        closeModal();
        renderTargetCard();
      };
    }

    const btnSeed = document.getElementById("btnSeedDemoInPicker");
    if (btnSeed) {
      btnSeed.onclick = async () => {
        btnSeed.disabled = true;
        try {
          await api.send("/api/targets/seed_demo", {});
          toast("5 демо-целей добавлены в базу");
          closeModal();
          route();
        } catch (err) {
          toast(err.message, "error");
        } finally {
          btnSeed.disabled = false;
        }
      };
    }
  }

  // Strategy Scroll Selection
  v.querySelectorAll(".strategy-chip").forEach(chip => {
    chip.onclick = () => {
      v.querySelectorAll(".strategy-chip").forEach(x => x.classList.remove("selected"));
      chip.classList.add("selected");
      activeStrategyId = chip.dataset.strategy;
      doGenerate();
    };
  });

  // AI Model Change
  const selAiModel = v.querySelector("#selAiModel");
  if (selAiModel) {
    selAiModel.onchange = () => {
      const chatModelName = v.querySelector("#chatModelName");
      if (chatModelName) {
        const optText = selAiModel.options[selAiModel.selectedIndex].text;
        chatModelName.textContent = optText.split(" ")[0] + " " + optText.split(" ")[1];
      }
      doGenerate();
    };
  }

  // Render Candidate Tabs (Sleek Segmented Controls)
  function renderCandidates(candidates, currentStrategyId, targetObj) {
    currentCandidates = candidates || [];
    const list = v.querySelector("#candidateTabsBar");
    if (!list) return;
    if (!candidates || !candidates.length) {
      list.innerHTML = `<div class="dim" style="font-size:12px;padding:6px">Нажмите «AI Синтез» для запуска генерации 4 вариантов.</div>`;
      return;
    }

    list.innerHTML = candidates.map((c, idx) => {
      const prob = c.probability || (c.is_winner ? 94 : 80 - idx * 4);
      return `
        <button class="candidate-tab-pill ${c.id === currentStrategyId ? 'active' : ''}" data-cand-id="${c.id}">
          <span class="cand-label">${c.is_winner ? ICONS.star + ' ' : ''}Вар. ${idx + 1}</span>
          <span class="cand-badge ${c.is_winner ? 'winner' : ''}">${prob}%</span>
        </button>
      `;
    }).join("");

    list.querySelectorAll(".candidate-tab-pill").forEach(tab => {
      tab.onclick = async () => {
        const cid = tab.dataset.candId;
        const cand = candidates.find(x => x.id === cid);
        if (!cand) return;
        list.querySelectorAll(".candidate-tab-pill").forEach(x => x.classList.remove("active"));
        tab.classList.add("active");
        editor.value = cand.text;
        autoResizeEditor();
        flashEditor();
        updateTextStats();

        const tid = !isManualMode ? activeTargetId : null;
        const manualTarget = isManualMode ? getManualTarget() : null;
        const wl = v.querySelector("#chkOfferWithLink").checked;
        try {
          const res = await api.send("/api/offer/classify", {
            text: cand.text,
            target_id: tid,
            target: manualTarget,
            with_link: wl
          });
          updateJudge(res);
        } catch (err) {}
      };
    });
  }

  // Generate Action
  async function doGenerate() {
    const tid = !isManualMode ? activeTargetId : null;
    const targetObj = isManualMode ? getManualTarget() : null;
    const model = (selAiModel ? selAiModel.value : "qwen3.8-flash");
    const promptHint = (v.querySelector("#offerPromptHint") ? v.querySelector("#offerPromptHint").value : "");
    const wl = v.querySelector("#chkOfferWithLink").checked;
    const btn = v.querySelector("#btnGenerateOffer");
    const origHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = `<span class="spin">${ICONS.sparkles}</span> <span>Синтез...</span>`;

    try {
      const res = await api.send("/api/offer/generate", {
        target_id: tid,
        target: targetObj,
        strategy_id: activeStrategyId,
        prompt_hint: promptHint,
        model: model,
        with_link: wl
      });

      editor.value = res.text;
      autoResizeEditor();
      flashEditor();
      renderCandidates(res.candidates, res.strategy, targetObj);
      updateJudge(res.classification);
      updateTextStats();
      toast("B.AI + Jev: 4 варианта синтезированы, выбран сильнейший!");
    } catch (e) {
      toast(e.message, "error");
    } finally {
      btn.disabled = false;
      btn.innerHTML = origHtml;
    }
  }
  v.querySelector("#btnGenerateOffer").onclick = doGenerate;

  // Real-time Classification on Input (Debounced)
  let classDebounce = null;
  editor.oninput = () => {
    autoResizeEditor();
    updateTextStats();
    clearTimeout(classDebounce);
    classDebounce = setTimeout(async () => {
      const text = editor.value.trim();
      if (!text) return;
      try {
        const tid = !isManualMode ? activeTargetId : null;
        const targetObj = isManualMode ? getManualTarget() : null;
        const wl = v.querySelector("#chkOfferWithLink").checked;
        const res = await api.send("/api/offer/classify", {
          text,
          target_id: tid,
          target: targetObj,
          with_link: wl
        });
        updateJudge(res);
      } catch (err) {}
    }, 350);
  };

  function updateTextStats() {
    const text = editor.value;
    const words = text ? text.trim().split(/\s+/).length : 0;
    const chars = text.length;
    const hasQuestion = (text.match(/\?/g) || []).length === 1;
    v.querySelector("#textStats").textContent = `${words} слов · ${chars} символов`;
    const spamBadge = v.querySelector("#antispamRuleBadge");
    if (spamBadge) {
      spamBadge.textContent = hasQuestion ? "1 легкий вопрос · антиспам ок" : (words > 50 ? "превышен лимит слов" : "без спам-маркеров");
    }
  }

  function updateJudge(res) {
    if (!res) return;
    const badge = v.querySelector("#scoreBadge");
    const numEl = v.querySelector("#scoreNumber");
    const titleEl = v.querySelector("#verdictTitle");
    const subEl = v.querySelector("#verdictSubtitle");
    const srcEl = v.querySelector("#judgeSource");
    const summaryEl = v.querySelector("#jevModelSummary");
    const bubbleScore = v.querySelector("#bubbleScoreText");
    const bubblePill = v.querySelector("#bubbleScorePill");

    numEl.textContent = res.score;
    badge.className = `jev-score-circle score-${res.verdict}`;
    titleEl.textContent = res.verdict_title;
    subEl.textContent = res.status_label;
    srcEl.textContent = res.source === "jev_ai" ? "JEV AI" : "JEV RULES";
    if (summaryEl) {
      summaryEl.textContent = res.ai_summary || "";
    }
    if (bubbleScore) {
      bubbleScore.textContent = `${res.score} / 100`;
    }
    if (bubblePill) {
      bubblePill.className = `bubble-score-badge score-${res.verdict}`;
    }

    // Update Dimension Micro-Bars
    const d = res.dimensions;
    v.querySelector("#scoreHook").textContent = `${d.hook.score}/${d.hook.max}`;
    v.querySelector("#barHook").style.width = `${(d.hook.score / d.hook.max) * 100}%`;

    v.querySelector("#scoreValue").textContent = `${d.value.score}/${d.value.max}`;
    v.querySelector("#barValue").style.width = `${(d.value.score / d.value.max) * 100}%`;

    v.querySelector("#scoreCta").textContent = `${d.cta.score}/${d.cta.max}`;
    v.querySelector("#barCta").style.width = `${(d.cta.score / d.cta.max) * 100}%`;

    v.querySelector("#scoreAntispam").textContent = `${d.antispam.score}/${d.antispam.max}`;
    v.querySelector("#barAntispam").style.width = `${(d.antispam.score / d.antispam.max) * 100}%`;

    // Update Checklist
    const c = res.checks;
    v.querySelector("#checklistContainer").innerHTML = `
      <li class="checklist-item ${c.under_word_limit ? 'pass' : 'fail'}">
        ${c.under_word_limit ? ICONS.check : ICONS.alert} До 50 слов (${res.words} слов)
      </li>
      <li class="checklist-item ${c.no_em_dash ? 'pass' : 'fail'}">
        ${c.no_em_dash ? ICONS.check : ICONS.alert} Без длинного тире (AI-маркер)
      </li>
      <li class="checklist-item ${c.single_question ? 'pass' : 'fail'}">
        ${c.single_question ? ICONS.check : ICONS.alert} Ровно один легкий вопрос
      </li>
      <li class="checklist-item ${c.no_price ? 'pass' : 'fail'}">
        ${c.no_price ? ICONS.check : ICONS.alert} Без цен в первом сообщении
      </li>
      <li class="checklist-item ${c.no_broken_vars ? 'pass' : 'fail'}">
        ${c.no_broken_vars ? ICONS.check : ICONS.alert} Переменные раскрыты корректно
      </li>
    `;

    // Recommendations
    const recBox = v.querySelector("#recommendationsBox");
    if (res.recommendations && res.recommendations.length) {
      recBox.innerHTML = `
        <div class="callout callout-warn" style="padding:10px 12px;margin:0;font-size:12px">
          ${ICONS.alert}
          <div>
            <b>Рекомендации Jev по доработке:</b>
            <ul style="margin:4px 0 0;padding-left:16px;line-height:1.4">
              ${res.recommendations.map(r => `<li>${esc(r)}</li>`).join("")}
            </ul>
          </div>
        </div>
      `;
    } else {
      recBox.innerHTML = `
        <div class="callout callout-ok" style="padding:10px 12px;margin:0;font-size:12px">
          ${ICONS.check}
          <div><b>Оффер идеален!</b> Все критерии cold outreach соблюдены на максимум.</div>
        </div>
      `;
    }
  }

  // Toggle Jev Checklist Accordion
  const btnToggle = v.querySelector("#btnToggleJevDetails");
  const accordionBody = v.querySelector("#jevAccordionBody");
  if (btnToggle && accordionBody) {
    btnToggle.onclick = () => {
      btnToggle.classList.toggle("open");
      accordionBody.classList.toggle("open");
    };
  }

  // Copy Action
  v.querySelector("#btnCopyOffer").onclick = async () => {
    await navigator.clipboard.writeText(editor.value);
    toast("Оффер скопирован в буфер");
  };

  // Queue Action
  v.querySelector("#btnQueueOffer").onclick = async () => {
    const text = editor.value.trim();
    if (!text) { alert("Текст оффера пуст"); return; }
    const tid = !isManualMode ? activeTargetId : null;
    if (!tid) {
      alert("Выберите компанию из базы, чтобы поставить оффер в очередь");
      return;
    }
    try {
      await api.send("/api/queue", { target_id: tid, body: text, kind: "dm" });
      toast("Оффер поставлен в очередь отправки!");
    } catch (e) { alert(e.message); }
  };

  // Save as Template Action
  v.querySelector("#btnSaveAsTpl").onclick = async () => {
    const text = editor.value.trim();
    if (!text) return;
    const name = prompt("Название нового шаблона:", "Оффер из студии");
    if (!name) return;
    await api.send("/api/templates", { name, category: "", body: text });
    toast("Шаблон успешно сохранен!");
  };

  // Humanizer Action
  v.querySelector("#btnImproveOffer").onclick = async () => {
    const text = editor.value.trim();
    if (!text) return;
    const tid = !isManualMode ? activeTargetId : null;
    const targetObj = isManualMode ? getManualTarget() : null;
    const model = (selAiModel ? selAiModel.value : "qwen3.8-flash");
    const btn = v.querySelector("#btnImproveOffer");
    const origHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = `<span class="spin">${ICONS.sparkles}</span> Humanizer...`;
    try {
      const r = await api.send("/api/offer/improve", {
        text,
        target_id: tid,
        target: targetObj,
        model: model,
        with_link: v.querySelector("#chkOfferWithLink").checked
      });
      editor.value = r.text;
      autoResizeEditor();
      flashEditor();
      updateJudge(r.classification);
      updateTextStats();
      toast("Оффер улучшен через Humanizer и очищен от клише!");
    } catch (err) {
      toast(err.message, "error");
    } finally {
      btn.disabled = false;
      btn.innerHTML = origHtml;
    }
  };

  // Initial render
  renderTargetCard();
  autoResizeEditor();
  doGenerate();
}

// View: Groups (Группы по нишам)
// --------------------------------------------------------------------------
async function viewGroups(v) {
  const only = new URLSearchParams(location.search).get("unposted") === "1";
  const d = await api.get("/api/groups?only_unposted=" + (only ? 1 : 0));
  const byNiche = {};
  d.items.forEach(g => { (byNiche[g.niche || "без ниши"] ||= []).push(g); });

  v.innerHTML = `
  <div class="callout callout-ok">
    ${ICONS.groups}
    <div>
      <b>Стратегия «сначала группы»:</b> публикация в проверенных чатах по нишам приносит входящие заявки от заинтересованных предпринимателей.
      На ответы лимитов нет, а риск блокировок аккаунта сведен к нулю.
    </div>
  </div>

  <div class="panel">
    <div class="row">
      <button class="btn btn-secondary" id="impG">Загрузить каталог из data/niches.py</button>
      <label class="dim" style="display:flex;align-items:center;gap:6px">
        <input type="checkbox" id="onlyUn" ${only ? "checked" : ""}> только не отработанные
      </label>
      <div class="spacer"></div>
      <span class="dim">Всего групп: <b>${num(d.total)}</b> · ниш: <b>${Object.keys(byNiche).length}</b></span>
    </div>
  </div>

  ${Object.entries(byNiche).map(([niche, list]) => `
    <div class="panel" style="padding:0;margin-bottom:16px">
      <div class="panel-header" style="padding:14px 18px;margin-bottom:0;background:var(--bg-subtle);border-bottom:1px solid var(--border)">
        <h3 class="panel-title">${esc(niche)}</h3>
        <span class="dim" style="font-size:12px">${list.length} чатов</span>
      </div>
      <div class="table-wrap" style="border:0">
        <table>
          <thead><tr><th>Чат</th><th>Участников</th><th>Статус публикации</th><th style="text-align:right">Действие</th></tr></thead>
          <tbody>
            ${list.map(g => `
              <tr>
                <td>
                  <a href="https://t.me/${esc(g.username)}" target="_blank" rel="noopener" class="mono" style="color:var(--primary);font-weight:600;text-decoration:none">
                    @${esc(g.username)}
                  </a>
                  <div class="dim" style="font-size:12px">${esc(g.title) || ""}</div>
                </td>
                <td>${g.members ? num(g.members) : "<span class='dim'>-</span>"}</td>
                <td>
                  ${g.posted_at
                    ? `<span class="tag" style="background:var(--ok-light);color:var(--ok);border-color:var(--ok-border)">${ICONS.check} ${esc(g.posted_at.slice(0, 16))}</span>`
                    : `<span class="tag s-new">Не размещались</span>`}
                </td>
                <td style="text-align:right">
                  <button class="btn btn-secondary btn-sm" data-g="${g.id}">Опубликовано</button>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    </div>
  `).join("")}`;

  v.querySelector("#onlyUn").onchange = e => {
    const u = new URL(location);
    e.target.checked ? u.searchParams.set("unposted", "1") : u.searchParams.delete("unposted");
    location.href = u;
  };
  v.querySelector("#impG").onclick = async e => {
    e.target.disabled = true;
    try {
      const r = await api.send("/api/groups/import");
      toast(`Групп добавлено: ${r.added}`); route();
    } catch (err) { toast(err.message, "error"); e.target.disabled = false; }
  };
  v.querySelectorAll("[data-g]").forEach(b => {
    b.onclick = async () => {
      await api.send(`/api/groups/${b.dataset.g}/posted`, { note: "" });
      toast("Отмечено как опубликованное"); route();
    };
  });
}
