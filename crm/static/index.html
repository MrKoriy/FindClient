async function viewLog(v) {
  const d = await api.get("/api/messages?limit=200");
  v.innerHTML = `
  <div class="panel" style="padding:0">
    <div class="panel-header" style="padding:16px 20px;border-bottom:1px solid var(--border);margin-bottom:0">
      <div>
        <h2 class="panel-title">${ICONS.log} Журнал отправки сообщений</h2>
        <div class="panel-subtitle">Полная история: кому, когда и какой текст был отправлен</div>
      </div>
      <button class="btn btn-secondary btn-sm" onclick="route()">Обновить журнал</button>
    </div>
    <div class="table-wrap" style="border:0">
      <table>
        <thead>
          <tr>
            <th>Время</th>
            <th>Получатель</th>
            <th>Текст сообщения</th>
            <th>Статус</th>
          </tr>
        </thead>
        <tbody>
          ${d.items.length ? d.items.map(m => `
            <tr>
              <td class="dim mono" style="font-size:12px;white-space:nowrap">${esc(m.sent_at || m.created_at)}</td>
              <td>
                <div style="font-weight:600">${esc(m.target_name || "-")}</div>
                <div class="mono" style="color:var(--primary)">@${esc(m.chat)}</div>
              </td>
              <td style="max-width:540px;line-height:1.45">
                ${esc(m.body || "")}
              </td>
              <td>
                ${m.status === "sent" ? `<span class="tag" style="background:var(--ok-light);color:var(--ok);border-color:var(--ok-border)">${ICONS.check} Отправлено</span>`
                  : m.status === "failed" ? `<span class="tag" style="background:var(--bad-light);color:var(--bad);border-color:var(--bad-border)">${ICONS.alert} Ошибка</span><div class="bad mono" style="font-size:11px;margin-top:4px">${esc(m.error)}</div>`
                  : m.status === "queued" ? `<span class="tag s-queued">В очереди</span>`
                  : `<span class="tag s-skip">${esc(m.status)}</span>`}
              </td>
            </tr>
          `).join("") : `<tr><td colspan="4" style="text-align:center;padding:40px" class="dim">Журнал пуст. Здесь появится история всех отправленных сообщений.</td></tr>`}
        </tbody>
      </table>
    </div>
  </div>`;
}

// --------------------------------------------------------------------------
// View: Templates (Шаблоны)
// --------------------------------------------------------------------------
async function viewTemplates(v) {
  const d = await api.get("/api/templates");
  v.innerHTML = `
  <div class="panel">
    <div class="panel-header">
      <div>
        <h2 class="panel-title">${ICONS.tpl} Шаблоны сообщений</h2>
        <div class="panel-subtitle">
          Переменные: <span class="mono ok">{facts}</span> (согласованное число отзывов),
          <span class="mono ok">{director}</span> (имя-отчество ЛПР из ЕГРЮЛ; нет данных — просто «Здравствуйте!»),
          <span class="mono">{name}</span>, <span class="mono">{category}</span>, <span class="mono">{city}</span>, <span class="mono">{link}</span>.
        </div>
      </div>
      <div class="row">
        <button class="btn btn-secondary btn-sm" id="btnCheckAllTpls">Проверить все на спам</button>
        <button class="btn btn-primary btn-sm" id="btnNewTpl">Добавить шаблон</button>
      </div>
    </div>

    ${d.items.map(t => `
      <div class="panel" style="background:var(--bg-subtle);border-color:var(--border);margin-bottom:14px" id="tplBlock-${t.id}">
        <div class="row" style="margin-bottom:10px">
          <input value="${esc(t.name)}" data-n="${t.id}" style="font-weight:600;min-width:200px" placeholder="Название шаблона">
          <input value="${esc(t.category)}" data-c="${t.id}" placeholder="Категория (пусто = подходит всем)" style="width:240px">
          <div class="spacer"></div>
          <button class="btn btn-purple btn-sm" data-testjev="${t.id}">${ICONS.sparkles} Jev-тест</button>
          <button class="btn btn-secondary btn-sm" data-save="${t.id}">Сохранить</button>
          <button class="btn btn-danger btn-sm" data-del="${t.id}">Удалить</button>
        </div>
        <textarea data-b="${t.id}" style="font-size:13.5px;min-height:90px">${esc(t.body)}</textarea>
        <div class="dim" id="chk-${t.id}" style="margin-top:8px"></div>
      </div>
    `).join("")}
  </div>`;

  v.querySelectorAll("[data-save]").forEach(b => {
    b.onclick = async () => {
      const id = b.dataset.save;
      await api.send("/api/templates", {
        id: +id,
        name: v.querySelector(`[data-n="${id}"]`).value,
        category: v.querySelector(`[data-c="${id}"]`).value,
        body: v.querySelector(`[data-b="${id}"]`).value
      });
      toast("Шаблон успешно сохранен");
      route();
    };
  });
  v.querySelectorAll("[data-del]").forEach(b => {
    b.onclick = async () => {
      if (!confirm("Удалить данный шаблон?")) return;
      await api.send(`/api/templates/${b.dataset.del}`, undefined, "DELETE");
      toast("Шаблон удален");
      route();
    };
  });
  v.querySelectorAll("[data-testjev]").forEach(b => {
    b.onclick = async () => {
      const id = b.dataset.testjev;
      const body = v.querySelector(`[data-b="${id}"]`).value;
      const res = await api.send("/api/offer/classify", { text: body });
      const el = v.querySelector(`#chk-${id}`);
      el.innerHTML = `
        <div class="callout callout-${res.score >= 80 ? 'ok' : 'warn'}" style="padding:8px 12px;margin:0">
          <div>
            <b>${esc(res.verdict_title)}: ${res.score}/100</b> · ${esc(res.status_label)}
            ${res.recommendations.length ? `<br><small class="bad">Замечания: ${res.recommendations.map(esc).join("; ")}</small>` : ""}
          </div>
        </div>
      `;
    };
  });
  v.querySelector("#btnNewTpl").onclick = async () => {
    await api.send("/api/templates", { name: "Новый шаблон", category: "", body: "Здравствуйте! Нашёл вас на картах: {facts}. " });
    route();
  };
  v.querySelector("#btnCheckAllTpls").onclick = async () => {
    for (const t of d.items) {
      const r = await api.get(`/api/preview?body=${encodeURIComponent(t.body)}&with_link=1`);
      const el = v.querySelector(`#chk-${t.id}`);
      el.innerHTML = r.problems.length
        ? `<span class="bad">Замечания: ${r.problems.map(esc).join("; ")}</span>`
        : `<span class="ok">Замечаний нет · ${r.words} слов</span>`;
    }
  };
}

// --------------------------------------------------------------------------
// View: Settings (Настройки)
// --------------------------------------------------------------------------
async function viewSettings(v) {
  const s = await api.get("/api/settings");
  v.innerHTML = `
  <div class="callout callout-warn">
    ${ICONS.alert}
    <div>
      <b>Лимиты безопасности аккаунта:</b> свежий аккаунт Telegram выдерживает 10-15 холодных контактов в день,
      прогретый - 30-40. Соблюдайте паузы в минуты между сообщениями для предотвращения спам-фильтра PEER_FLOOD.
    </div>
  </div>

  <div class="panel">
    <h2 class="panel-title" style="margin-bottom:16px">${ICONS.send} Режим отправки</h2>
    <div style="display:flex;flex-direction:column;gap:12px">
      <label style="display:flex;align-items:center;gap:10px;cursor:pointer">
        <input type="checkbox" id="enabled" ${s.enabled === "1" ? "checked" : ""}>
        <span><b>Отправка разрешена</b> (воркер активно отправляет сообщения из очереди)</span>
      </label>
      <label style="display:flex;align-items:center;gap:10px;cursor:pointer">
        <input type="checkbox" id="dry_run" ${s.dry_run === "1" ? "checked" : ""}>
        <span><b>Холостой ход</b> (воркер разбирает очередь, но реальные сообщения не шлются в сеть)</span>
      </label>
      <label style="display:flex;align-items:center;gap:10px;cursor:pointer">
        <input type="checkbox" id="first_message_no_link" ${s.first_message_no_link === "1" ? "checked" : ""}>
        <span><b>Без ссылки в первом сообщении</b> (защита от мгновенного фильтра спама)</span>
      </label>
    </div>
  </div>

  <div class="panel">
    <h2 class="panel-title" style="margin-bottom:16px">${ICONS.set} Лимиты, задержки и рабочие часы</h2>
    <div class="row" style="margin-bottom:14px">
      <label class="dim" style="display:flex;flex-direction:column;gap:4px">
        Максимум сообщений в день
        <input id="daily_cap" type="number" min="1" max="100" value="${esc(s.daily_cap)}" style="width:140px">
      </label>
      <label class="dim" style="display:flex;flex-direction:column;gap:4px">
        Случайная пауза от, сек
        <input id="min_delay" type="number" min="5" value="${esc(s.min_delay)}" style="width:140px">
      </label>
      <label class="dim" style="display:flex;flex-direction:column;gap:4px">
        до, сек
        <input id="max_delay" type="number" min="5" value="${esc(s.max_delay)}" style="width:140px">
      </label>
    </div>

    <div class="row" style="margin-bottom:14px">
      <label class="dim" style="display:flex;flex-direction:column;gap:4px">
        Длинная пауза после каждых N сообщений
        <input id="cooldown_every" type="number" min="1" value="${esc(s.cooldown_every)}" style="width:160px">
      </label>
      <label class="dim" style="display:flex;flex-direction:column;gap:4px">
        Длительность длинной паузы, сек
        <input id="cooldown_seconds" type="number" min="60" value="${esc(s.cooldown_seconds)}" style="width:160px">
      </label>
    </div>

    <div class="row" style="margin-bottom:14px">
      <label class="dim" style="display:flex;flex-direction:column;gap:4px">
        Рабочие часы с
        <input id="work_from" type="number" min="0" max="23" value="${esc(s.work_from)}" style="width:90px">
      </label>
      <label class="dim" style="display:flex;flex-direction:column;gap:4px">
        по
        <input id="work_to" type="number" min="0" max="24" value="${esc(s.work_to)}" style="width:90px">
      </label>
      <label class="dim" style="display:flex;flex-direction:column;gap:4px">
        Часовой пояс (UTC+)
        <input id="timezone_offset" type="number" min="-12" max="14" value="${esc(s.timezone_offset)}" style="width:90px">
      </label>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h2 class="panel-title">${ICONS.sparkles} Генеративная AI-модель (B.AI Gateway)</h2>
      <span class="judge-source-tag ok">Qwen 3.8 Flash + DeepSeek</span>
    </div>
    <div style="font-size:12.5px;color:var(--text-secondary);margin-bottom:14px">
      Подключение B.AI для синтеза живых B2B-офферов и рерайта через встроенные скиллы (Russian B2B Outreach + Humanizer).
    </div>
    <div style="display:flex;flex-direction:column;gap:12px;max-width:600px">
      <label class="dim" style="display:flex;flex-direction:column;gap:4px">
        B.AI API Key (sk-...)
        <input id="bai_api_key" type="password" value="${esc(s.bai_api_key || '')}" placeholder="sk-...">
      </label>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <label class="dim" style="display:flex;flex-direction:column;gap:4px">
          Основная модель
          <select id="bai_model">
            <option value="qwen3.8-flash" ${s.bai_model === "qwen3.8-flash" || !s.bai_model ? "selected" : ""}>Qwen 3.8 Flash (Рекомендуется для РФ)</option>
            <option value="deepseek-v4.1-flash" ${s.bai_model === "deepseek-v4.1-flash" ? "selected" : ""}>DeepSeek V4.1 Flash (Логика)</option>
            <option value="glm-5.3-flash" ${s.bai_model === "glm-5.3-flash" ? "selected" : ""}>GLM 5.3 Flash (Flash)</option>
            <option value="mimo-v2.6-flash" ${s.bai_model === "mimo-v2.6-flash" ? "selected" : ""}>Mimo V2.6 Flash</option>
          </select>
        </label>
        <label class="dim" style="display:flex;flex-direction:column;gap:4px">
          Базовый URL эндпоинта
          <input id="bai_base_url" value="${esc(s.bai_base_url || 'https://api.b.ai/v1')}">
        </label>
      </div>

      <div style="margin-top:4px;display:flex;flex-direction:column;gap:8px">
        <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer">
          <input type="checkbox" id="enable_humanizer" ${s.enable_humanizer !== "0" ? "checked" : ""}>
          <span><b>Скилл Humanizer:</b> запрет на длинные тире, стоп-слова, пафос и шаблонные AI-клише</span>
        </label>
        <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer">
          <input type="checkbox" id="enable_russian_outreach" ${s.enable_russian_outreach !== "0" ? "checked" : ""}>
          <span><b>Скилл Russian B2B Outreach:</b> микро-формат в Telegram (до 45 слов), без созвонов и американской лести</span>
        </label>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2 class="panel-title" style="margin-bottom:16px">${ICONS.sparkles} Интеграция с TypeSafe Jev API</h2>
    <div style="display:flex;flex-direction:column;gap:12px;max-width:600px">
      <label class="dim" style="display:flex;flex-direction:column;gap:4px">
        TypeSafe API Key (необязательно, для Jev AI Judge)
        <input id="typesafe_api_key" type="password" value="${esc(s.typesafe_api_key || '')}" placeholder="apikey_...">
      </label>
      <label class="dim" style="display:flex;flex-direction:column;gap:4px">
        Модель Jev
        <input id="typesafe_model" value="${esc(s.typesafe_model || 'jev-latest')}" placeholder="jev-latest">
      </label>
    </div>
  </div>

  <div class="row">
    <button class="btn btn-primary" id="btnSaveSettings">Сохранить все настройки</button>
  </div>`;

  v.querySelector("#btnSaveSettings").onclick = async e => {
    e.target.disabled = true;
    const val = id => {
      const el = v.querySelector("#" + id);
      return el.type === "checkbox" ? (el.checked ? "1" : "0") : el.value;
    };
    try {
      await api.send("/api/settings", Object.fromEntries(
        ["enabled", "dry_run", "first_message_no_link", "daily_cap", "min_delay", "max_delay",
         "cooldown_every", "cooldown_seconds", "work_from", "work_to", "timezone_offset",
         "typesafe_api_key", "typesafe_model",
         "bai_api_key", "bai_model", "bai_base_url", "enable_humanizer", "enable_russian_outreach"]
        .map(id => [id, val(id)])));
      toast("Настройки успешно сохранены!");
      route();
    } catch (err) {
      toast(err.message, "error");
      e.target.disabled = false;
    }
  };
}

// Initial start
route();
</script>
</body>
</html>
